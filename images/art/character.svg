      <path fill="#7df3ff" d="M353 141 L359 140 L356 147 Z"/>
      <path fill="none" stroke="#0c0e2c" stroke-width="1.6" stroke-linecap="round" d="M351 153 C356 156 362 156 367 154"/>
      <path fill="#14174a" d="M344 122 C354 116 366 116 378 121 L376 125 C366 122 354 122 346 127 Z"/>
      <path fill="#d99ab8" opacity=".42" d="M346 170 C354 166 366 168 372 174 C364 182 350 182 346 170 Z"/>
      <path fill="none" stroke="#3b2f5e" stroke-width="1.8" stroke-linecap="round" d="M337 180 C342 180 346 179 350 177"/>
