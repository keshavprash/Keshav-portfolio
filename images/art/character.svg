      <path fill="#ffb648" d="M366 394 L380 392 L382 410 L368 412 Z"/>
    </g>

    <!-- Back hair: wind-swept tufts streaming to the right -->
    <g filter="url(#rim)">
      <path fill="url(#hair)" d="M352 112 C354 74 388 46 428 44 C436 30 450 20 470 14 C463 28 462 40 466 50 C484 40 504 36 526 40 C512 50 506 60 504 72 C526 68 548 72 568 88 C548 92 534 100 526 112 C548 114 570 124 586 144 C562 142 544 148 532 158 C550 166 564 180 570 200 C550 190 532 190 516 196 C522 210 524 228 516 246 C506 232 492 224 478 222 C476 238 468 252 452 264 C452 246 446 232 438 222 L416 204 Z"/>
      <path fill="#262f78" d="M398 62 C426 50 464 52 494 74 C472 70 452 72 436 80 C460 84 486 98 502 122 C472 104 438 98 410 104 C400 90 396 76 398 62 Z"/>
      <path fill="#1c2460" d="M456 138 C484 138 512 150 532 172 C506 166 480 166 460 174 C474 178 488 188 496 202 C470 190 444 188 428 192 C432 172 442 150 456 138 Z"/>
      <path fill="#9d7bff" opacity=".85" d="M506 126 C520 132 532 142 540 156 C526 148 514 142 500 140 Z"/>
