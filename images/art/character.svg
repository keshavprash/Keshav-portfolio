      <path fill="url(#hood)" d="M344 276 C340 240 368 214 412 212 C462 210 502 232 510 270 C516 296 500 322 466 334 C430 346 384 342 360 322 C350 312 346 296 344 276 Z"/>
      <path fill="#0b0f28" d="M372 272 C384 246 412 236 438 238 C462 240 480 254 486 274 C460 294 402 296 372 272 Z"/>
