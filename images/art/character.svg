    <path fill="#a49dc0" d="M378 192 L442 196 L446 262 C424 280 392 282 372 266 Z"/>
    <path fill="#67618f" d="M404 196 L442 196 L446 262 C436 270 424 274 410 276 C414 246 412 222 404 196 Z"/>

    <!-- Hood gathered behind the neck -->
