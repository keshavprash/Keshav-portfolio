    <g filter="url(#rimThin)">
      <path fill="#171d48" d="M306 1016 C300 1036 282 1054 256 1064 C240 1070 236 1086 250 1090 L384 1092 C396 1092 398 1080 396 1070 L390 1018 Z"/>
