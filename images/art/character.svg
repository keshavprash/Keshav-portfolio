<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1160" width="760" height="1160">
  <!-- Original character drawn for this site by hand, as code. Not traced from, or based on, any existing character, franchise or artwork.
       Cel-shaded night lighting: cyan key from the hologram (left), violet rim from the city (right), amber accents. -->
  <defs>
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="3.2" dy=".8" result="oL"/>
      <feComposite in="SourceAlpha" in2="oL" operator="out" result="edgeL"/>
      <feFlood flood-color="#7df3ff"/>
      <feComposite in2="edgeL" operator="in" result="rimL"/>
      <feOffset in="SourceAlpha" dx="-2.6" dy="-.6" result="oR"/>
      <feComposite in="SourceAlpha" in2="oR" operator="out" result="edgeR"/>
      <feFlood flood-color="#9d7bff" flood-opacity=".9"/>
      <feComposite in2="edgeR" operator="in" result="rimR"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rimR"/><feMergeNode in="rimL"/></feMerge>
    </filter>
    <filter id="rimThin" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="1.8" dy=".5" result="oL"/>
      <feComposite in="SourceAlpha" in2="oL" operator="out" result="edgeL"/>
      <feFlood flood-color="#8ef5ff" flood-opacity=".95"/>
      <feComposite in2="edgeL" operator="in" result="rimL"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rimL"/></feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2=".25">
      <stop offset="0" stop-color="#26346f"/><stop offset=".4" stop-color="#1a2352"/><stop offset="1" stop-color="#11173a"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4288"/><stop offset="1" stop-color="#172049"/>
    </linearGradient>
    <linearGradient id="trouser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2149"/><stop offset=".55" stop-color="#10152f"/><stop offset="1" stop-color="#0b0e22"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4f2f4"/><stop offset=".42" stop-color="#c3bad2"/><stop offset="1" stop-color="#7a729f"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2=".7">
      <stop offset="0" stop-color="#1c2460"/><stop offset=".5" stop-color="#121640"/><stop offset="1" stop-color="#0c0e2c"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20295e"/><stop offset="1" stop-color="#121739"/>
    </linearGradient>
  </defs>

  <!-- Wind layer: jacket tail and hanging straps. Kept as its own group so WebGL can animate it separately. -->
  <g id="wind" filter="url(#rim)">
    <path fill="#0d1230" d="M500 556 C526 604 566 640 628 664 C656 676 686 680 716 678 C694 694 664 702 632 702 C644 716 660 728 682 736 C640 744 596 736 556 712 C528 694 504 676 486 650 Z"/>
    <path fill="#1d2759" d="M512 590 C540 632 582 664 640 682 C600 688 556 668 526 636 Z"/>
    <path fill="none" stroke="#7df3ff" stroke-opacity=".7" stroke-width="2.4" d="M522 640 C562 682 612 704 670 708"/>
    <path fill="none" stroke="#ffb648" stroke-width="4.5" stroke-linecap="round" d="M552 650 C580 684 606 716 622 758"/>
    <path fill="#ffb648" d="M614 754 L632 750 L640 786 L622 790 Z"/>
  </g>

  <g id="figure">
    <!-- Rear leg (screen right) -->
    <g filter="url(#rim)">
