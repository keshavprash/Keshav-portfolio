      <path fill="#2b3780" d="M430 1048 C452 1040 492 1040 526 1048 L528 1062 C492 1056 446 1058 416 1066 Z"/>
      <path fill="#ffb648" d="M478 1022 L520 1022 L522 1034 L478 1036 Z"/>
      <path fill="#7df3ff" d="M398 1086 L540 1084 C542 1092 538 1098 528 1098 L410 1098 C400 1098 396 1092 398 1086 Z"/>
