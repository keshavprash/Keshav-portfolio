      <path fill="none" stroke="#2f3b80" stroke-width="3" stroke-linecap="round" d="M330 356 C380 376 470 376 520 352"/>
      <path fill="#0c1029" d="M318 520 C376 540 470 540 530 516 L531 544 C470 568 374 568 317 548 Z"/>
      <path fill="#2b3676" d="M318 520 C376 540 470 540 530 516 L530 522 C470 546 376 546 318 526 Z"/>
      <path fill="none" stroke="#7df3ff" stroke-opacity=".6" stroke-width="2.6" d="M310 656 C372 682 490 678 540 652"/>
      <!-- pocket -->
      <path fill="#121739" d="M470 580 L534 572 L540 650 L476 658 Z"/>
      <path fill="none" stroke="#3a4890" stroke-width="2.4" d="M470 580 L534 572"/>
      <!-- utility tag -->
      <path fill="#ffb648" d="M356 584 L404 582 L404 600 L356 602 Z"/>
      <path fill="#14193e" d="M362 588 L398 587 L398 591 L362 592 Z M362 595 L386 594 L386 597 L362 598 Z"/>
