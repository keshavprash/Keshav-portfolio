      <path fill="none" stroke="#3a4890" stroke-width="4.5" stroke-linecap="round" d="M417 56 C448 82 458 120 452 156"/>
      <ellipse cx="446" cy="176" rx="30" ry="38" fill="#0b0e28" transform="rotate(-10 446 176)"/>
      <ellipse cx="448" cy="176" rx="20" ry="27" fill="#232c6c" transform="rotate(-10 448 176)"/>
      <ellipse cx="448" cy="176" rx="9" ry="14" fill="#ffb648" filter="url(#glow)" transform="rotate(-10 448 176)"/>
    </g>
  </g>
</svg>
